name: Companion CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      core_revision:
        description: Optional full SpaceAGORA commit SHA for a compatibility probe
        required: false
        default: ""

permissions:
  contents: read

jobs:
  installation-and-native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_LOAD_PATH: "@:@stdlib"
      JULIA_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      JULIA_PKG_PRECOMPILE_AUTO: "0"
      SPACEAGORA_MUJOCO_REQUIRED: "1"
      SPACEAGORA_CORE_REV: ${{ inputs.core_revision || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.3'
          arch: x64
      - name: Verify installation plan without downloading dependencies
        run: julia --startup-file=no test/installation_plan_tests.jl
      - name: Verify exact core acquisition using local Git fixtures
        run: julia --startup-file=no test/source_acquisition_tests.jl
      - name: Install pinned core and companion independently
        run: julia --startup-file=no scripts/setup_env.jl "$RUNNER_TEMP/mujoco-env"
      - name: Core-only import and compatibility isolation
        run: julia --startup-file=no --project="$RUNNER_TEMP/mujoco-env" test/core_only.jl
      - name: Reject an incompatible contract before defining the adapter
        run: julia --startup-file=no --project="$RUNNER_TEMP/mujoco-env" test/incompatible_core.jl
      - name: Core-first adapter load and contract conformance
        run: julia --startup-file=no --project="$RUNNER_TEMP/mujoco-env" test/load_order.jl core-first
      - name: Companion-first adapter load and contract conformance
        run: julia --startup-file=no --project="$RUNNER_TEMP/mujoco-env" test/load_order.jl companion-first
      - name: Refuse a scene without the MuJoCo library
        run: julia --startup-file=no --project="$RUNNER_TEMP/mujoco-env" test/missing_native.jl
      - name: Mandatory native tests with four threads
        run: julia --startup-file=no --project="$RUNNER_TEMP/mujoco-env" -e '@assert Threads.nthreads() == 4; include("test/runtests.jl")'
      - name: Verify tracked installation inputs were not changed
        run: git diff --exit-code

  core-release-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.3'
          arch: x64
      - name: The pinned core is a SpaceAGORA release
        run: julia --startup-file=no test/core_release_pin.jl

  benchmark-harness-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Synthetic comparison and failure guards (no native or remote workload)
        run: python -B -m unittest discover -s benchmarks/basilisk_mujoco_xval -p test_harness.py
